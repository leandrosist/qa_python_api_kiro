name: API Tests - Restful Booker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Permissão de escrita necessária para o deploy na branch gh-pages
permissions:
  contents: write

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Behave tests with Allure formatter
        env:
          BASE_URL: https://restful-booker.herokuapp.com
          AUTH_USER: admin
          AUTH_PASS: password123
        run: |
          python -m behave -f allure_behave.formatter:AllureFormatter -o allure-results

      - name: Upload Allure results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7

      # Faz checkout da branch gh-pages para que a action consiga
      # ler o histórico de execuções anteriores (trend, retries, etc.)
      - name: Get Allure history from gh-pages
        if: always()
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        # Na primeira execução a branch ainda não existe; o continue-on-error
        # evita que o job falhe por causa disso.
        continue-on-error: true

      - name: Generate Allure HTML report with history
        if: always()
        uses: simple-elf/allure-report-action@v1.9
        with:
          allure_results: allure-results
          allure_report: allure-report
          allure_history: allure-history
          gh_pages: gh-pages
          keep_reports: 20

      - name: Deploy Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
